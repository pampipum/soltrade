name: SOLtrade Daily AI Alert

on:
  schedule:
    # 8:00 AM Swiss Time (CEST = UTC+2, maps to 06:00 UTC)
    - cron: '0 6 * * *'
    # 5:00 PM Swiss Time (CEST = UTC+2, maps to 15:00 UTC)
    - cron: '0 15 * * *'
  # Allows you to manually trigger it from the GitHub Actions tab
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Alert Script
        run: node scripts/send-analysis.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
